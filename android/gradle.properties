# 코드 네임스페이스(R 클래스 패키지). 사용자에게 보이지 않으므로 앱 이름과 따로 둔다.
reader.namespace=io.github.kgcaudit.reader
# 앱 식별자(B1, 2026-09-23 결정). applicationId 는 설치된 앱의 신원이라, 사람들이 설치한
# 뒤에 바꾸면 "다른 앱" 이 되어 책갈피·진도가 따라오지 않는다. 배포 전까지만 자유.
reader.applicationId=io.github.kgcaudit.oloebook
reader.appName=OLO eBook

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
