name: core (jvm)

# Android SDK 없이 도는 빠른 게이트.
# :document / :core-layout 이 순수 Kotlin이라 SDK 설치 없이 몇십 초면 끝난다.
# 이 잡이 깨지면 플랫폼 의존이 코어로 샜거나 파싱·조판 로직이 회귀한 것이다.

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-core.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-core.yml']

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: check (의존 규칙 + 단위 테스트)
        run: ./gradlew :document:check :core-layout:check --stacktrace
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/*/build/reports/tests/
